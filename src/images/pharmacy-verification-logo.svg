<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 120" width="400" height="120">
  <!-- Rounded rectangle with green border (Pantone 7731 C) -->
  <rect x="1" y="1" width="398" height="118" rx="10" ry="10" fill="#FFFFFF" stroke="#2B6B3E" stroke-width="2" />
  
  <!-- Green Cross - Light green part (Pantone 2270 C - C60 M0 Y90 K0) -->
  <path d="M30 20 L60 20 L60 50 L30 50 Z" fill="#6CC24A" />
  <path d="M60 20 L90 20 L90 50 L60 50 Z" fill="#6CC24A" />
  <path d="M30 50 L60 50 L60 80 L30 80 Z" fill="#6CC24A" />
  <path d="M60 50 L90 50 L90 80 L60 80 Z" fill="#6CC24A" />
  
  <!-- Dark green part (Pantone 7731 C - C78 M3 Y84 K22) -->
  <path d="M45 35 L75 35 L75 65 L45 65 Z" fill="#2B6B3E" />
  
  <!-- White curved dividing line in the center of the cross -->
  <path d="M45 50 Q60 40 75 50 Q60 60 45 50" fill="#FFFFFF" />
  
  <!-- Ukrainian Flag - Blue part (Pantone 2935 C - C100 M63 Y0 K2) -->
  <rect x="15" y="35" width="40" height="15" fill="#0057B8" />
  <!-- Ukrainian Flag - Yellow part (Pantone 012 C - C0 M2 Y100 K0) -->
  <rect x="15" y="50" width="40" height="15" fill="#FFD700" />
  
  <!-- Text "Перевір легальність роботи аптеки" -->
  <text x="110" y="60" font-family="Bookman Old Style, serif" font-size="16" fill="#000000">
    <tspan x="110" y="50">Перевір легальність</tspan>
    <tspan x="110" y="70">роботи аптеки</tspan>
  </text>
</svg>